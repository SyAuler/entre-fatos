<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <!-- textura de papel de aquarela: grão em relevo iluminado de lado, quase branco -->
  <filter id="p" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".035 .05" numOctaves="2" seed="7" stitchTiles="stitch" result="fibra"/>
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4" seed="3" stitchTiles="stitch" result="grao"/>
    <feComposite in="grao" in2="fibra" operator="arithmetic" k1="0" k2=".75" k3=".25" k4="0"/>
    <feDiffuseLighting surfaceScale="1.6" diffuseConstant="1.12" lighting-color="#fffefb">
      <feDistantLight azimuth="135" elevation="62"/>
    </feDiffuseLighting>
  </filter>
  <rect width="400" height="400" fill="#fff"/>
  <rect width="400" height="400" filter="url(#p)" opacity=".3"/>
</svg>
